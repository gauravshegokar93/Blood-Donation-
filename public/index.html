<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Session - BloodBank Management System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>WADHOKAR GROUP OF COMPANIES</h1>
            <p class="subtitle">Blood Donation Camp</p>
            <form id="start-session-form">
                <div class="form-group">
                    <label for="bdc-location">BDC Location</label>
                    <select id="bdc-location" name="location" required>
                        <option value="">Loading locations...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bdc-year">BDC Year</label>
                    <select id="bdc-year" name="year" required>
                        <option value="">Loading years...</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Start</button>
            </form>
            <p id="error-message" style="color: var(--primary-color); margin-top: 1rem;"></p>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
